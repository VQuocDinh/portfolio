<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'light') document.documentElement.classList.remove('dark');
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vo Quoc Dinh | Frontend & Fullstack Developer</title>
    <meta name="description" content="Portfolio of Vo Quoc Dinh, a Fullstack Developer specializing in React, NestJS, and EdTech solutions." />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              apple: {
                bg: 'rgb(var(--color-apple-bg) / <alpha-value>)',
                surface: 'rgb(var(--color-apple-surface) / <alpha-value>)',
                muted: 'rgb(var(--color-apple-muted) / <alpha-value>)',
                border: 'rgb(var(--color-apple-border) / <alpha-value>)',
                text: 'rgb(var(--color-apple-text) / <alpha-value>)',
                secondary: 'rgb(var(--color-apple-secondary) / <alpha-value>)',
                tertiary: 'rgb(var(--color-apple-tertiary) / <alpha-value>)',
                blue: '#0071e3',
                'blue-hover': '#0077ED',
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Inter', 'Helvetica Neue', 'sans-serif'],
            },
            boxShadow: {
              /* Neumorphism — soft convex (light); dark: override via index.css .neu-* ) */
              'apple': '6px 6px 14px rgba(163,177,198,0.45), -6px -6px 14px rgba(255,255,255,0.92)',
              'apple-md': '10px 10px 22px rgba(163,177,198,0.48), -8px -8px 20px rgba(255,255,255,0.95)',
              'apple-lg': '14px 14px 28px rgba(163,177,198,0.42), -10px -10px 24px rgba(255,255,255,0.9)',
              'apple-xl': '18px 18px 36px rgba(163,177,198,0.4), -12px -12px 28px rgba(255,255,255,0.88)',
              'inner-soft': 'inset 3px 3px 8px rgba(163,177,198,0.35), inset -3px -3px 8px rgba(255,255,255,0.85)',
            },
            letterSpacing: {
              'tighter-plus': '-0.03em',
            }
          },
        },
      }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        /* Neumorphism base — soft gray canvas */
        --color-apple-bg: 225 229 235;
        --color-apple-surface: 232 236 242;
        --color-apple-muted: 216 220 228;
        --color-apple-border: 190 198 210;
        --color-apple-text: 45 48 55;
        --color-apple-secondary: 95 100 112;
        --color-apple-tertiary: 120 125 135;
      }
      html.dark {
        --color-apple-bg: 42 44 50;
        --color-apple-surface: 48 50 58;
        --color-apple-muted: 38 40 46;
        --color-apple-border: 62 65 74;
        --color-apple-text: 235 236 240;
        --color-apple-secondary: 165 168 178;
        --color-apple-tertiary: 130 133 142;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif;
        background-color: rgb(var(--color-apple-bg));
        color: rgb(var(--color-apple-text));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--color-apple-muted));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--color-apple-border));
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--color-apple-tertiary));
      }
      ::selection {
        background: rgba(0, 113, 227, 0.25);
        color: rgb(var(--color-apple-text));
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.7",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@emailjs/browser": "https://esm.sh/@emailjs/browser@^4.4.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
